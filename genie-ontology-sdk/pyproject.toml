[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-ontology-sdk"
version = "0.0.1"
description = "Automates the standup of modeled knowledge for Genie Ontology: UC sources -> metric views -> UC Pages -> Genie Agents -> tuning plan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  "databricks-sdk>=0.40",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genie_ontology_sdk = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
