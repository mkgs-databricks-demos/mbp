# genie-build-waves — Parallel Genie Code build orchestration for any Databricks project.
# Deploy this bundle, then point it at a target project's waves.json manifest.
# See README.md for usage.

bundle:
  name: genie-build-waves
  engine: direct

include:
  - resources/*.yml

# ---------------------------------------------------------------------------
# Variables — pass at deploy time: databricks bundle deploy --var key=value
# Do NOT edit this file with project-specific values. Keep it generic.
# ---------------------------------------------------------------------------
variables:
  # Human-readable project name. Used in job display names and commit messages.
  project_name:
    description: "Project name for job titles (e.g. 'My App')"
    default: "Genie Build Waves"

  # One deployment per project: appended to the bundle root path so each project gets its
  # own deployment state and its own build/setup/smoke jobs. Empty keeps the original path
  # (.bundle/genie-build-waves/<target>). Example: "-my-project".
  instance_suffix:
    description: "Per-project deployment suffix (e.g. '-my-project'); empty = default instance"
    default: ""

  # Absolute workspace path to the Git folder being built.
  # Sessions edit files here; the integrator commits here.
  build_root:
    description: "Workspace path to the target project's Git folder"

  # Feature branch the integrator commits and pushes to. Never main or master.
  build_branch:
    description: "Feature branch for the build (never main/master)"

  # Absolute path to the project's waves.json manifest.
  manifest_path:
    description: "Absolute path to the project's waves.json"

  # Unity Catalog location for publishing the build skills.
  skills_catalog:
    description: "UC catalog for build skills"
  skills_schema:
    description: "UC schema for build skills"

  # Whether the setup job should create the skills schema if it doesn't exist.
  # Set to "false" if using an existing schema or if you lack CREATE SCHEMA permission.
  create_skills_schema:
    description: "Auto-create the skills schema (true/false)"
    default: "true"

  # Skill identifiers — defaults work for most deployments.
  runner_skill_id:
    description: "UC Skill id for the session runner"
    default: "genie_build_session_runner"
  integrator_skill_id:
    description: "UC Skill id for the wave integrator"
    default: "genie_build_wave_integrator"
  monitor_skill_id:
    description: "UC Skill id for the external build monitor (no automation uses it; empty skips publishing)"
    default: "genie_build_monitor"

  # Optional external monitoring agent (any agent that reads job runs and the monitor skill).
  # Application (client) ID of its service principal. Set:
  # * deploy grants it monitor_job_level on the build job (bundle-managed job ACL), and
  # * setup grants it USE CATALOG, USE SCHEMA and READ VOLUME on the monitor skill only.
  # Empty (default): no grants. The build_root folder grant stays manual (README: "External monitor").
  monitor_principal:
    description: "Service principal application ID of an external monitoring agent; empty = no grants"
    default: ""
  # CAN_VIEW: report only (level 1). CAN_MANAGE_RUN: repair runs (levels 2-3). Never CAN_MANAGE.
  monitor_job_level:
    description: "Build job permission for monitor_principal: CAN_VIEW or CAN_MANAGE_RUN"
    default: "CAN_VIEW"

targets:
  # Pass project-specific values at deploy time with --var flags.
  # Example:
  #   databricks bundle deploy --target dev \
  #     --var="project_name=My App" \
  #     --var="instance_suffix=-my-app" \
  #     --var="build_root=/Workspace/Users/you@example.com/my-project" \
  #     --var="build_branch=feature-genie-build" \
  #     --var="manifest_path=/Workspace/Users/you@example.com/my-project/docs/plans/waves.json" \
  #     --var="skills_catalog=my_catalog" \
  #     --var="skills_schema=my_schema"
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}${var.instance_suffix}/${bundle.target}
    variables:
      # Example placeholders — override at deploy time with --var flags.
      # These exist so `bundle validate` passes without --var.
      build_root: /Workspace/Users/you@example.com/my-project
      build_branch: feature-genie-build
      manifest_path: /Workspace/Users/you@example.com/my-project/docs/plans/waves.json
      skills_catalog: hls_fde_dev
      skills_schema: dev_build_waves
      # Uncomment to grant an external monitor the build job and the monitor skill (or pass --var):
      # monitor_principal: 00000000-0000-0000-0000-000000000000  # monitor SPN application ID
      # monitor_job_level: CAN_MANAGE_RUN  # default CAN_VIEW (report only)

  prod:
    mode: production
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}${var.instance_suffix}/${bundle.target}
    run_as:
      user_name: matthew.giglia@databricks.com
    variables:
      # Example placeholders — override at deploy time with --var flags.
      build_root: /Workspace/Users/you@example.com/my-project
      build_branch: feature-genie-build
      manifest_path: /Workspace/Users/you@example.com/my-project/docs/plans/waves.json
      skills_catalog: hls_fde
      skills_schema: build_waves
