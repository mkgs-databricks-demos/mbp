# Cross-view benchmark questions (session 10c): two or more metric views per question.
# Views: mv_bakehouse_sales (S), mv_bakehouse_customer_activity (C), mv_bakehouse_supplier_coverage (F).
# Join paths: S<->F on Franchise ID / Franchise Country / City / Size; S<->C on customer geography and gender
# (Customer Country / Continent / State / Gender; S has no Customer ID); C<->F on country (C 'USA' = F 'US').
# expected_sql checked read-only on the SQL warehouse: 2026-11-28 (all 59 SUCCEEDED).
- id: x-001
  question: "How much gross sales came from stores that have an ingredient supplier on file versus stores with no supplier on file?"
  expected_sql: |-
    WITH s AS (SELECT `Franchise ID`, MEASURE(`Gross Sales`) AS gross_sales FROM ${target_catalog}.${target_schema}.mv_bakehouse_sales GROUP BY ALL),
    f AS (SELECT `Franchise ID`, `Supplier Status` FROM ${target_catalog}.${target_schema}.mv_bakehouse_supplier_coverage GROUP BY ALL)
    SELECT f.`Supplier Status`, SUM(s.gross_sales) AS gross_sales
    FROM f JOIN s ON s.`Franchise ID` = f.`Franchise ID`
    GROUP BY f.`Supplier Status` ORDER BY gross_sales DESC
  tags: ["type:cross_view", "view:mv_bakehouse_sales", "view:mv_bakehouse_supplier_coverage", "measure:mv_bakehouse_sales.Gross Sales", "dimension:mv_bakehouse_sales.Franchise ID", "dimension:mv_bakehouse_supplier_coverage.Franchise ID", "dimension:mv_bakehouse_supplier_coverage.Supplier Status", "kpi:gross_sales"]
- id: x-002
  question: "What is the average transaction value at stores with a supplier on file compared with stores without one?"
  expected_sql: |-
    WITH s AS (SELECT `Franchise ID`, MEASURE(`Gross Sales`) AS gross_sales, MEASURE(`Transaction Count`) AS transactions FROM ${target_catalog}.${target_schema}.mv_bakehouse_sales GROUP BY ALL),
    f AS (SELECT `Franchise ID`, `Supplier Status` FROM ${target_catalog}.${target_schema}.mv_bakehouse_supplier_coverage GROUP BY ALL)
    SELECT f.`Supplier Status`, ROUND(SUM(s.gross_sales) / SUM(s.transactions), 2) AS average_transaction_value
    FROM f JOIN s ON s.`Franchise ID` = f.`Franchise ID`
    GROUP BY f.`Supplier Status` ORDER BY f.`Supplier Status`
  tags: ["type:ratio", "view:mv_bakehouse_sales", "view:mv_bakehouse_supplier_coverage", "measure:mv_bakehouse_sales.Gross Sales", "measure:mv_bakehouse_sales.Transaction Count", "measure:mv_bakehouse_sales.Average Transaction Value", "dimension:mv_bakehouse_sales.Franchise ID", "dimension:mv_bakehouse_supplier_coverage.Franchise ID", "dimension:mv_bakehouse_supplier_coverage.Supplier Status", "kpi:average_transaction_value"]
