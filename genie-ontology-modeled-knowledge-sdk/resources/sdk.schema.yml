# New-schema mode (recommended): the bundle creates the SDK schema. Used by
# targets dev and prod; the sdk_wheels volume is in sdk_wheels.volume.yml.
#
# Grants come from var.sdk_schema_grants: the deploying developer in dev,
# `account users` in prod, overridable per target.
targets:
  dev:
    resources:
      schemas:
        sdk:
          catalog_name: ${var.sdk_catalog}
          name: ${var.sdk_schema}
          comment: Genie Ontology Modeled Knowledge SDK assets (wheels volume, published skills, build scratch views)
          grants: ${var.sdk_schema_grants}

  prod:
    resources:
      schemas:
        sdk:
          catalog_name: ${var.sdk_catalog}
          name: ${var.sdk_schema}
          comment: Genie Ontology Modeled Knowledge SDK assets (wheels volume, published skills, build scratch views)
          grants: ${var.sdk_schema_grants}
