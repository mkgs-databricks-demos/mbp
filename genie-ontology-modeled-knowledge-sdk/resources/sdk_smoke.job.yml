# Proves the published SDK wheel installs and reports its version.
#
# Serverless notebook task with a job-level environment whose dependencies
# reference the wheel built by artifacts.sdk_wheel (../dist/*.whl, relative to
# this file). Referencing the artifact is what makes `bundle deploy` upload it to
# workspace.artifact_path (the sdk_wheels volume). Same job in every target.
resources:
  jobs:
    sdk_smoke:
      name: sdk_smoke
      description: Install the Genie Ontology Modeled Knowledge SDK wheel from the sdk_wheels volume and print __version__
      max_concurrent_runs: 1
      environments:
        - environment_key: sdk
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: sdk_smoke
          environment_key: sdk
          notebook_task:
            notebook_path: ../notebooks/sdk_smoke.ipynb
