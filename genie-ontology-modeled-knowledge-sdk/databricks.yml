# Genie Ontology Modeled Knowledge SDK - SDK bundle.
#
# Owns the SDK's own Unity Catalog schema, the sdk_wheels volume, the SDK wheel
# artifact (built on deploy, uploaded to the volume through
# workspace.artifact_path) and the sdk_smoke job. Later builds add the published
# skills and build-only scratch_* views, all in this one schema.
#
# SDK setup asks: which catalog (sdk_catalog), which schema (sdk_schema; a NEW
# schema the bundle creates is recommended) and, optionally, who reads the SDK
# assets (sdk_schema_grants / sdk_volume_grants). Readers default per target:
# the deploying developer in dev, the account group `account users` in prod.
# Any principal works (user name, account-level group, service principal
# application id); workspace-local groups such as `admins` cannot hold Unity
# Catalog grants. See docs/distribution/README.md.
#
# Modes:
#   * new-schema (recommended): targets dev and prod create the schema
#     (resources/sdk.schema.yml) and put the volume in it.
#   * existing-schema: target prod_existing_schema creates only the volume, in
#     the existing schema named by sdk_schema (resources/sdk.existing_schema.yml).
#
# No workspace host, user names or real catalog / warehouse values live in this
# file. Use a CLI profile for the workspace and put real values in the
# gitignored .databricks/bundle/<target>/variable-overrides.json.
bundle:
  name: genie_ontology_modeled_knowledge_sdk

include:
  - resources/*.yml

# Pure-Python wheel, built on `bundle deploy` from pyproject.toml (static version,
# no dynamic versioning). `pip wheel` is used because the `build` module is not
# always installed where deploys run (see docs/distribution/README.md). build/ and
# dist/ are removed first: setuptools reuses a stale build/lib (workspace file
# timestamps), which shipped old module copies in the first 0.1.1 build.
artifacts:
  sdk_wheel:
    type: whl
    path: .
    build: rm -rf build dist && python -m pip wheel --no-deps --no-build-isolation -w dist .

# Sync only the bundle's own files (the SDK package, its metadata and the
# sdk_smoke notebook). The built wheel is uploaded as an artifact; dist/ and
# build/ are left to .gitignore (strict validate rejects exclude patterns that
# match no files before the first build).
sync:
  exclude:
    - "Genie Code Start Session - DO NOT EDIT.ipynb"
    - ci/**
    - docs/**
    - examples/**
    - notebooks/init_ontology_project.ipynb
    - skills/**
    - templates/**
    - tests/**

variables:
  sdk_catalog:
    description: Existing catalog that holds the SDK schema
  sdk_schema:
    description: SDK schema name (new-schema mode creates it, prefixed per user in development mode; existing-schema mode uses it as is)
    default: ontology_sdk
  sdk_schema_grants:
    description: >-
      Unity Catalog grants on the SDK schema, a list of {principal, privileges}.
      Default `account users`; dev defaults to the deploying user. Override the
      whole list per target in variable-overrides.json to use a group or add a
      service principal (application id).
    type: complex
    default:
      - principal: account users
        privileges: [USE_SCHEMA]
  sdk_volume_grants:
    description: >-
      Unity Catalog grants on the sdk_wheels volume, a list of {principal,
      privileges}. Same defaults and override rule as sdk_schema_grants.
    type: complex
    default:
      - principal: account users
        privileges: [READ_VOLUME]
  warehouse_id:
    description: SQL warehouse for SDK setup checks and later SDK jobs
  tags_project:
    description: Project tag applied to taggable resources
    default: genie-ontology-modeled-knowledge-sdk
  tags_businessUnit:
    description: Business unit tag applied to taggable resources
    default: ""
  tags_requestedBy:
    description: Requesting team tag applied to taggable resources
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      # The deploying developer by default; override in variable-overrides.json.
      sdk_schema_grants:
        - principal: ${workspace.current_user.userName}
          privileges: [USE_SCHEMA]
      sdk_volume_grants:
        - principal: ${workspace.current_user.userName}
          privileges: [READ_VOLUME]
    workspace:
      # Wheels go to the bundle's own sdk_wheels volume (no DBFS).
      artifact_path: ${resources.volumes.sdk_wheels.volume_path}
    presets:
      tags:
        project: ${var.tags_project}
        businessUnit: ${var.tags_businessUnit}
        requestedBy: ${var.tags_requestedBy}
        env: ${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
      artifact_path: ${resources.volumes.sdk_wheels.volume_path}
    presets:
      tags:
        project: ${var.tags_project}
        businessUnit: ${var.tags_businessUnit}
        requestedBy: ${var.tags_requestedBy}
        env: ${bundle.target}

  prod_existing_schema:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
      artifact_path: ${resources.volumes.sdk_wheels.volume_path}
    presets:
      tags:
        project: ${var.tags_project}
        businessUnit: ${var.tags_businessUnit}
        requestedBy: ${var.tags_requestedBy}
        env: ${bundle.target}
