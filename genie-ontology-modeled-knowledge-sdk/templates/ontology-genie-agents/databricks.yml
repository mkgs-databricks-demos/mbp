# Genie Ontology Modeled Knowledge SDK - DAB 2: Genie Agents.
# Deploys one Genie Agent per agents/<name>.geniespace.json with the genie_spaces resource.
# Space files are tokenized; render them into .rendered/ before validate/deploy (see README.md).
# No workspace hosts here: use your CLI profile (DATABRICKS_CONFIG_PROFILE or --profile).
bundle:
  name: ontology-genie-agents
  engine: direct  # genie_spaces is supported by the direct deployment engine only (CLI >= 1.3.0)

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse id the Genie Agents run their queries on.
  catalog:
    description: Catalog that holds the metric views (environment discriminator, e.g. dev / prd catalog).
  schema:
    description: Full metric view schema name in that catalog, including any dev prefix.
  agent_permissions:
    description: >-
      Permissions on every Genie Agent, a list of {level, one typed principal
      key (user, group or service principal)}. Default CAN_RUN for the account
      group `account users`; dev defaults to none beyond the deploying
      developer, who owns the agents. Override the whole list per target in
      variable-overrides.json, for example a curator group with CAN_EDIT or a
      service principal (application id) with CAN_RUN.
    type: complex
    default:
      - level: CAN_RUN
        group_name: account users
  genie_parent_path:
    description: Workspace folder the Genie Agents are created in.

targets:
  dev:
    mode: development
    default: true
    variables:
      genie_parent_path: ${workspace.root_path}/genie
      # The deploying developer owns the agents; add others in variable-overrides.json.
      agent_permissions: []

  prd:
    mode: production
    # genie_parent_path, warehouse_id, catalog and schema come from
    # .databricks/bundle/prd/variable-overrides.json or --var flags; agent_permissions
    # defaults to CAN_RUN for `account users` and can be overridden there.
