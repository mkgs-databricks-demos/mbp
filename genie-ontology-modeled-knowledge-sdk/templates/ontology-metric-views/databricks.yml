# Genie Ontology Modeled Knowledge SDK - metric view bundle (DAB 1).
#
# Owns the metric view YAML files under metric_views/<domain>/ and the
# register_metric_views job that registers them (forEach) and tests them.
#
# No workspace host, user names or real catalog / warehouse values live in this
# file. Use a CLI profile for the workspace and put real values in the
# gitignored .databricks/bundle/<target>/variable-overrides.json (see README.md).
bundle:
  name: ontology-metric-views

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog that holds the ontology schema and the registered metric views (the environment discriminator)
  source_catalog:
    description: Catalog of the source tables, substituted for the source_catalog token in metric view YAML
  source_schema:
    description: Schema of the source tables, substituted for the source_schema token in metric view YAML
  warehouse_id:
    description: Optional SQL warehouse, used only by ad hoc checks when set and reported in resolved_target.json (the job's tasks run on serverless notebooks)
    default: ""
  schema_name:
    description: Name of the ontology schema that receives the metric views (prefixed per user in development mode)
    default: ontology
  consumer_group:
    # No default on purpose: the owner must name the group that may read the metric views.
    description: Required. Group granted USE_SCHEMA and SELECT on the ontology schema (no default; name a group in variable-overrides.json or --var consumer_group=...)

targets:
  dev:
    mode: development
    default: true
    # Placeholders for the source and catalog values. Real values, and the
    # required consumer_group, go in .databricks/bundle/dev/variable-overrides.json
    # (gitignored).
    variables:
      catalog: main
      source_catalog: samples
      source_schema: tpch

  prd:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
