# One genie_spaces entry per agents/<name>.geniespace.json.
# file_path points at the RENDERED copy (.rendered/, gitignored): the CLI inlines the file as
# serialized_space without ${...} interpolation, so the committed source stays tokenized
# (${target_catalog}.${target_schema}) and is rendered per target first (README.md).
# file_path takes precedence over serialized_space and is relative to THIS file (resources/).
resources:
  genie_spaces:
    # One agent: the domain has 7 registered metric views (<= max_metric_views_per_agent = 50).
    tpch_supply_chain_agent:
      title: TPC-H Supply Chain Agent
      description: Genie Agent over the TPC-H supply chain metric views (sales, fulfillment, procurement) registered by the ontology-metric-views bundle.
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.genie_parent_path}
      file_path: ../.rendered/tpch_supply_chain_agent.geniespace.json
      # var.agent_permissions: none beyond the deploying developer in dev, CAN_RUN for `account users` elsewhere.
      permissions: ${var.agent_permissions}
