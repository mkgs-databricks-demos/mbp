  expected_sql: SELECT MEASURE(`Inventory Value`) FILTER (WHERE `Supplier Region` = 'ASIA') / MEASURE(`Inventory Value`) AS asia_share FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost
  expected_answer: 0.2011
  tags: ['type:ratio', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Inventory Value', 'dimension:Supplier Region']
- id: f063
  question: What is the average inventory value per offer by brand, for the 5 brands with the highest value per offer?
  expected_sql: SELECT `Part Brand`, MEASURE(`Inventory Value`) / MEASURE(`Offer Count`) AS inventory_value_per_offer FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost GROUP BY ALL ORDER BY inventory_value_per_offer DESC LIMIT 5
  tags: ['type:ratio', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Inventory Value', 'measure:Offer Count', 'dimension:Part Brand']
- id: f064
  question: What is the stock on hand by vendor country?
  expected_sql: SELECT `Supplier Nation`, MEASURE(`Available Quantity`) AS available_quantity FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost GROUP BY ALL ORDER BY `Supplier Nation`
  tags: ['type:synonym', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Available Quantity', 'dimension:Supplier Nation']
- id: f065
  question: What is the unit cost by product type for STANDARD POLISHED parts?
  expected_sql: SELECT `Part Type`, MEASURE(`Average Supply Cost`) AS average_supply_cost FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost WHERE `Part Type` LIKE 'STANDARD POLISHED%' GROUP BY ALL ORDER BY `Part Type`
  tags: ['type:synonym', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Average Supply Cost', 'dimension:Part Type']
- id: f066
  question: How many suppliers offer part key 1?
  expected_sql: SELECT MEASURE(`Supplier Count`) AS supplier_count FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost WHERE `Part Key` = 1
  expected_answer: 4
  tags: ['type:edge', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Supplier Count', 'dimension:Part Key']
- id: f067
  question: How many distinct parts are offered by suppliers in each region (a part offered in several regions counts in each)?
  expected_sql: SELECT `Supplier Region`, MEASURE(`Part Count`) AS part_count FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost GROUP BY ALL ORDER BY `Supplier Region`
  tags: ['type:edge', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Part Count', 'dimension:Supplier Region']
- id: f068
  question: What is the minimum supply cost for parts of size 51, which is outside the valid size range?
  expected_sql: SELECT MEASURE(`Minimum Supply Cost`) AS minimum_supply_cost FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost WHERE `Part Size` = 51
  tags: ['type:edge', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Minimum Supply Cost', 'dimension:Part Size']
- id: f069
  question: What is the lowest unit supply cost offered for each part brand?
  expected_sql: SELECT `Part Brand`, MEASURE(`Minimum Supply Cost`) AS minimum_supply_cost FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_supply_cost GROUP BY ALL ORDER BY `Part Brand`
  tags: ['type:breakdown', 'view:mv_tpch_supply_chain_supply_cost', 'measure:Minimum Supply Cost', 'dimension:Part Brand']
