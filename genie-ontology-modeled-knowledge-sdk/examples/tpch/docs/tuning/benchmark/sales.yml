    question: "How many orders are on record in total?"
    expected_sql: |-
      SELECT MEASURE(`Order Count`) AS order_count FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_orders
    expected_answer: 7500000
    tags:
      - "type:simple"
      - "view:mv_tpch_supply_chain_orders"
      - "measure:mv_tpch_supply_chain_orders.Order Count"
  - id: s002
    question: "What is the combined header total price of all orders?"
