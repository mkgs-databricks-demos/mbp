# Benchmark questions: sales metric views (orders, revenue, market_share).
# Session 32 (build 1, wave 1-6). expected_sql is tokenized; render ${target_catalog}/${target_schema}
# from examples/tpch/docs/registration/resolved_target.json. Statement states are in sales_notes.md.
questions:
