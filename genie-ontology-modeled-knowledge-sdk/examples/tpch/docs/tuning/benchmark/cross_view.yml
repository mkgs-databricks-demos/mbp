# Cross-view benchmark questions (session 34, build-1 wave 1-6). Ids prefixed "x".
# Every question needs two or more TPC-H metric views. expected_sql is tokenized with
# ${target_catalog}.${target_schema} and joins per-view MEASURE() CTEs on a shared dimension.
questions:
  - id: x001
    question: "For each order year, how many orders were placed and how much net revenue was booked?"
    expected_sql: |-
      WITH o AS (SELECT `Order Year` AS order_year, MEASURE(`Order Count`) AS order_count FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_orders GROUP BY ALL),
      r AS (SELECT `Order Year` AS order_year, MEASURE(`Revenue`) AS revenue FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_revenue GROUP BY ALL)
      SELECT o.order_year, o.order_count, r.revenue FROM o JOIN r USING (order_year) ORDER BY o.order_year
    tags: ["type:cross_view", "type:time", "view:mv_tpch_supply_chain_orders", "view:mv_tpch_supply_chain_revenue", "measure:mv_tpch_supply_chain_orders.Order Count", "measure:mv_tpch_supply_chain_revenue.Revenue", "dimension:mv_tpch_supply_chain_orders.Order Year", "dimension:mv_tpch_supply_chain_revenue.Order Year"]
  - id: x002
    question: "Which customer region earns the most net revenue per order, dividing line-level revenue by the order count from the orders view?"
    expected_sql: |-
      WITH o AS (SELECT `Customer Region` AS region, MEASURE(`Order Count`) AS order_count FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_orders GROUP BY ALL),
      r AS (SELECT `Customer Region` AS region, MEASURE(`Revenue`) AS revenue FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_revenue GROUP BY ALL)
      SELECT o.region, ROUND(r.revenue / o.order_count, 2) AS revenue_per_order FROM o JOIN r USING (region) ORDER BY revenue_per_order DESC LIMIT 1
    tags: ["type:cross_view", "type:ratio", "view:mv_tpch_supply_chain_orders", "view:mv_tpch_supply_chain_revenue", "measure:mv_tpch_supply_chain_orders.Order Count", "measure:mv_tpch_supply_chain_revenue.Revenue", "dimension:mv_tpch_supply_chain_orders.Customer Region", "dimension:mv_tpch_supply_chain_revenue.Customer Region"]
  - id: x003
    question: "By market segment, compare the total order price on order headers with the net revenue from line items."
    expected_sql: |-
      WITH o AS (SELECT `Market Segment` AS segment, MEASURE(`Order Total Price`) AS order_total_price FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_orders GROUP BY ALL),
      r AS (SELECT `Market Segment` AS segment, MEASURE(`Revenue`) AS revenue FROM ${target_catalog}.${target_schema}.mv_tpch_supply_chain_revenue GROUP BY ALL)
      SELECT o.segment, o.order_total_price, r.revenue, ROUND(r.revenue / o.order_total_price, 4) AS revenue_to_order_price FROM o JOIN r USING (segment) ORDER BY o.segment
    tags: ["type:cross_view", "type:breakdown", "view:mv_tpch_supply_chain_orders", "view:mv_tpch_supply_chain_revenue", "measure:mv_tpch_supply_chain_orders.Order Total Price", "measure:mv_tpch_supply_chain_revenue.Revenue", "dimension:mv_tpch_supply_chain_orders.Market Segment", "dimension:mv_tpch_supply_chain_revenue.Market Segment"]
  - id: x004
