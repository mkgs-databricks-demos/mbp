# Sales Revenue Metric View
# Parameterized for CI/CD — source and target are injected at registration time
# Test fixture copied from examples/metric_views/sales/mv_sales_revenue.yml;
# adds the '# subdomain:' header and the '# verified:' join evidence (MV005).
# subdomain: revenue
#
# Registration command (executed by forEach task):
#   CREATE OR REPLACE VIEW ${target_catalog}.${target_schema}.mv_sales_revenue
#   WITH METRICS LANGUAGE YAML AS $ <this file> $

version: 1.1
comment: "Sales revenue metrics with customer segmentation. Excludes refunds and cancellations."

source: ${source_catalog}.${source_schema}.orders

joins:
  - name: customer
    source: ${source_catalog}.${source_schema}.dim_customers
    on: source.customer_id = customer.customer_id
    cardinality: many_to_one
    # verified: many_to_one on customer_id, 0% orphans (data_model_summary.md)
    rely:
      at_most_one_match: true

filter: source.order_status = 'COMPLETED'

dimensions:
  - name: Order Date
    expr: source.order_date
    comment: "Date the order was placed"
    format:
      type: date
      date_format: year_month_day

  - name: Order Month
    expr: DATE_TRUNC('MONTH', source.order_date)
    comment: "Month of order, truncated to first day"
    format:
      type: date
      date_format: locale_short_month

  - name: Customer Segment
    expr: customer.segment
    comment: "Customer market segment from dim_customers"
    synonyms:
      - market segment
      - customer type

  - name: Region
    expr: customer.region
    synonyms:
      - geography
      - territory

measures:
  - name: Order Count
    expr: COUNT(*)
    comment: "Total number of completed orders"

  - name: Revenue
    expr: SUM(source.order_amount)
    comment: "Completed-order revenue in USD after order-level exclusions"
    display_name: "Total Revenue"
    synonyms:
      - sales
      - net sales
      - order revenue
      - top line
    format:
      type: currency
      currency_code: USD
      abbreviation: compact

  - name: Average Order Value
    expr: SUM(source.order_amount) / COUNT(*)
    comment: "Revenue divided by order count"
    synonyms:
      - AOV
      - avg order size
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Unique Customers
    expr: COUNT(DISTINCT source.customer_id)
    comment: "Distinct customers with completed orders"

  - name: Revenue per Customer
    expr: SUM(source.order_amount) / COUNT(DISTINCT source.customer_id)
    comment: "Average revenue per unique customer"
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

materialization:
  mode: relaxed
  schedule: every 6 hours
  materialized_views:
    - name: revenue_by_month_segment
      type: aggregated
      dimensions:
        - Order Month
        - Customer Segment
        - Region
      measures:
        - "*"
      refresh_policy: auto
      cluster_by:
        auto: true
