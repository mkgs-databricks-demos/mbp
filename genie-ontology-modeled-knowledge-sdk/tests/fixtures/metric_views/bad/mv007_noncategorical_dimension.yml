# Bad fixture for MV007: materializes a unique key and a continuous amount.
version: 1.1
source: ${source_catalog}.${source_schema}.orders

dimensions:
  - name: Order Key
    expr: source.o_orderkey

  - name: Order Total
    expr: source.o_totalprice
    format:
      type: currency
      currency_code: USD

  - name: Order Priority
    expr: source.o_orderpriority

measures:
  - name: Order Count
    expr: COUNT(1)
    comment: "Number of orders"

materialization:
  mode: relaxed
  materialized_views:
    - name: orders_by_key
      type: aggregated
      dimensions:
        - Order Key
        - Order Total
        - Order Priority
      measures:
        - Order Count
      refresh_policy: auto
