# CI for genie-ontology-modeled-knowledge-sdk.
#
# Staged under genie-ontology-modeled-knowledge-sdk/ci/github/workflows/; the
# owner moves it to <repo root>/.github/workflows/ (see ci/README.md). All paths
# below are relative to the repository root.
name: genie-ontology-modeled-knowledge-sdk-ci

on:
  pull_request:
    paths:
      - "genie-ontology-modeled-knowledge-sdk/**"
      - ".github/workflows/genie-ontology-modeled-knowledge-sdk-ci.yml"

permissions:
  contents: read

concurrency:
  group: genie-ontology-modeled-knowledge-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: genie-ontology-modeled-knowledge-sdk

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor = the lower bound in pyproject.toml; keep the two in sync.
        databricks-sdk: ["0.45.0", "latest"]
    env:
      # The run kit test validates templates/run/waves.json with the repo's genie-build-waves.
      GENIE_BUILD_WAVES_DIR: ${{ github.workspace }}/genie-build-waves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Pin databricks-sdk
        run: |
          if [ "${{ matrix.databricks-sdk }}" = "latest" ]; then
            pip install --upgrade "databricks-sdk<1"
          else
            pip install "databricks-sdk==${{ matrix.databricks-sdk }}"
          fi
          python -c "import databricks.sdk.version as v; print('databricks-sdk', v.__version__)"
      - run: python -m pytest -q -rs

  wheel:
    # Build the wheel, install it into a clean venv and run the suite from a copy
    # without src/, so the tests exercise the installed package (site-packages).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        databricks-sdk: ["0.45.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-deps -w dist .
          ls dist/genie_ontology_modeled_knowledge_sdk-*-py3-none-any.whl
      - name: Install into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/genie_ontology_modeled_knowledge_sdk-*-py3-none-any.whl pytest
          if [ "${{ matrix.databricks-sdk }}" = "latest" ]; then
            /tmp/wheel-venv/bin/pip install --upgrade "databricks-sdk<1"
          else
            /tmp/wheel-venv/bin/pip install "databricks-sdk==${{ matrix.databricks-sdk }}"
          fi
          for cmd in gos-check-config gos-validate-mv gos-build-manifest gos-render-agents gos-scaffold gos-resolve-target gos-benchmark; do
            /tmp/wheel-venv/bin/$cmd --help > /dev/null
          done
      - name: Test the installed wheel (src/ not importable)
        env:
          GENIE_BUILD_WAVES_DIR: ${{ github.workspace }}/genie-build-waves
        run: |
          rm -rf /tmp/sdk-nosrc && cp -r . /tmp/sdk-nosrc && rm -rf /tmp/sdk-nosrc/src
          cd /tmp/sdk-nosrc
          /tmp/wheel-venv/bin/python -c "import genie_ontology_modeled_knowledge_sdk as m, sys; assert 'site-packages' in m.__file__, m.__file__; print(m.__file__, m.__version__)"
          /tmp/wheel-venv/bin/python -m pytest -q -rs -o pythonpath=
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.databricks-sdk == 'latest' }}
        with:
          name: genie-ontology-modeled-knowledge-sdk-wheel
          path: genie-ontology-modeled-knowledge-sdk/dist/*.whl

  bundle-validate:
    # Runs only when the OIDC variables for a dev workspace are configured (owner step P1-7).
    # The CLI checks that the /Volumes workspace.artifact_path exists during validate, so
    # the SDK bundle is validated with REAL dev values from repository variables
    # (placeholder catalogs cannot validate). Skipped when those variables are not set.
    if: ${{ vars.DATABRICKS_HOST != '' && vars.DATABRICKS_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate the SDK bundle (dev, real values)
        if: ${{ vars.GOS_SDK_CATALOG != '' && vars.GOS_SDK_CONSUMER_GROUP != '' && vars.GOS_WAREHOUSE_ID != '' }}
        run: |
          databricks bundle validate --strict -t dev \
            --var "sdk_catalog=${{ vars.GOS_SDK_CATALOG }}" \
            --var "sdk_consumer_group=${{ vars.GOS_SDK_CONSUMER_GROUP }}" \
            --var "warehouse_id=${{ vars.GOS_WAREHOUSE_ID }}"
      - name: Validate the metric view template bundle
        working-directory: genie-ontology-modeled-knowledge-sdk/templates/ontology-metric-views
        run: databricks bundle validate --strict -t dev
      - name: Validate the Genie Agent template bundle
        working-directory: genie-ontology-modeled-knowledge-sdk/templates/ontology-genie-agents
        run: databricks bundle validate --strict -t dev
