[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-ontology-modeled-knowledge-sdk"
version = "0.0.1"
description = "Automates the standup of modeled knowledge for Genie Ontology: UC sources -> metric views -> UC Pages -> Genie Agents -> tuning plan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  # Floor = first release with every WorkspaceClient method the SDK calls (see ci/README.md).
  "databricks-sdk>=0.45.0,<1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genie_ontology_modeled_knowledge_sdk = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Lint scope is the SDK package and its tests. Notebooks, templates, examples and
# skills are owned by other build sessions and are brought under lint separately
# (see ci/README.md); the start-session notebook is never edited.
extend-exclude = [
  "Genie Code Start Session - DO NOT EDIT.ipynb",
  "docs",
  "examples",
  "notebooks",
  "skills",
  "templates",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
